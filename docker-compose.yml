services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-sentinela
    ports:
      - "5672:5672"     # porta AMQP
      - "15672:15672"   # porta web (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    build: ./php
    container_name: php-sentinela
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq   # dentro da rede do compose usa o nome do serviço e a porta 5672
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: pass
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "composer install --no-interaction &&
             echo '==> Finalizado! Rode: docker compose exec php php bin/check_worker.php' &&
             sleep infinity"

volumes:
  rabbitmq_data:
